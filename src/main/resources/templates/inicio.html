<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">titulo</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <header class="cabecera">
        <h1 th:text="${titulo}">titulo</h1>
        <p>pagina armada por spring boot a las <strong th:text="${hora}">00:00:00</strong></p>
    </header>

    <nav class="acciones-pagina" aria-label="Acciones de la página">
        <a class="boton" href="/lugares/nuevo">Agregar más</a>
        <details class="autoria">
            <summary class="boton secundario">Elaborado por</summary>
            <div class="datos-autoria">
                <p><strong>Nombre:</strong> Andrea Yineth Ricera Lopez</p>
                <p><strong>Número de ficha:</strong> 3230489</p>
                <p><strong>Programa:</strong> ADSO</p>
            </div>
        </details>
    </nav>

    <p class="vacio" th:if="${#lists.isEmpty(lugares)}">Todavía no hay lugares. ¡Agregue el primero!</p>

    <main class="tarjetas">
        <article class="tarjeta" th:each="lugar : ${lugares}">
            <span class="sector" th:text="${lugar.sector}">Sector</span>
            <h2 th:text="${lugar.nombre}">Nombre del lugar</h2>
            <p th:text="${lugar.descripcion}">Descripción del lugar</p>
        </article>
    </main>

    <footer class="pie">SENA - ADSO - Ficha 3230489</footer>
    
</body>
</html>
